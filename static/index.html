<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTF Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="card panel-main">
        <div class="tag">CTF Web Dashboard</div>
        <h1>通过者统计与用户连接列表</h1>
        <p>当前先提供一个基础 HTTP 页面，展示通过者数量和连接列表。后续可以直接在这个基础上接入真实数据源。</p>
      </div>
      <div class="card panel-side">
        <div class="num-label">通过者数量</div>
        <div class="num" id="passed-count">0</div>
        <div class="updated">最后更新：<span id="updated-at">--</span></div>
      </div>
    </section>

    <section class="card list">
      <div class="head">
        <h2>用户连接列表</h2>
        <span>当前连接数：<b id="connection-count">0</b></span>
      </div>
      <div class="table-box" id="table-box"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
